name: ci

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
    steps:
      - uses: actions/checkout@v7

      # Reads minimum_zig_version from build.zig.zon and caches the
      # Zig global cache between runs.
      - uses: mlugg/setup-zig@v2.2.1

      - run: zig fmt --check .
      - run: zig build -Doptimize=${{ matrix.optimize }}
      - run: zig build test -Doptimize=${{ matrix.optimize }} --summary all
