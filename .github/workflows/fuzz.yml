name: fuzz

# Short runs on every push, a long run nightly. The six fuzz tests in
# src/tests/fuzz.zig run in one `zig build test --fuzz` step, and each
# test gets the whole run count, so a push runs six million inputs in
# all. The corpus is cached so each run
# continues from the last. A crash fails the job and uploads the input
# as an artifact.
#
# The corpus lives under one cache key. A cache entry cannot be
# overwritten, so a run that succeeds deletes this branch's entry and
# saves a new one. A failed run keeps the old entry.

on:
  push:
    branches: [master, develop]
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs for each fuzz test"
        default: "50000000"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # One run per branch at a time, so two runs cannot both delete the
    # corpus entry and race to save it. A queued run waits, not cancels.
    concurrency:
      group: fuzz-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write # to delete the old corpus cache entry
    env:
      CORPUS_KEY: fuzz-corpus-v1
      RUNS: ${{ github.event_name == 'push' && '1000000' || inputs.runs || '50000000' }}
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2.2.1

      # restore-keys still picks up a corpus saved under an older key.
      - name: Restore corpus
        uses: actions/cache/restore@v6
        with:
          path: .zig-cache/f
          key: ${{ env.CORPUS_KEY }}
          restore-keys: fuzz-

      - name: Fuzz
        run: zig build test -Dllvm --fuzz=$RUNS

      - name: Upload crash
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash
          path: .zig-cache/f/crash
          if-no-files-found: ignore

      # Only this branch's entry: other branches keep theirs.
      - name: Delete old corpus cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$CORPUS_KEY" --json id --jq '.[].id')
          for id in $ids; do
            gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
          done

      - name: Save corpus
        uses: actions/cache/save@v6
        with:
          path: .zig-cache/f
          key: ${{ env.CORPUS_KEY }}
