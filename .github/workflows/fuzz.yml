name: fuzz

# Short runs on every push, a long run nightly. All four fuzz tests in
# src/tests/fuzz.zig run in one `zig build test --fuzz` step, and the
# run count is shared between them. The corpus is cached so each run
# continues from the last. A crash fails the job and uploads the input
# as an artifact.

on:
  push:
    branches: [master, develop]
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs, shared by all fuzz tests"
        default: "50000000"

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUNS: ${{ github.event_name == 'push' && '1000000' || inputs.runs || '50000000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2.2.1

      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: .zig-cache/f
          key: fuzz-${{ github.run_id }}
          restore-keys: fuzz-

      - name: Fuzz
        run: zig build test -Dllvm --fuzz=$RUNS

      - name: Upload crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash
          path: .zig-cache/f/crash
          if-no-files-found: ignore
